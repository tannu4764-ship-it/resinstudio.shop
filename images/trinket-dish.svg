<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Floral resin trinket dish with gold gilded scalloped rim and embedded botanicals">
  <defs>
    <linearGradient id="tdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F6"/>
      <stop offset="100%" stop-color="#F3E8E2"/>
    </linearGradient>
    <linearGradient id="dishGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D4"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6207"/>
    </linearGradient>
    <filter id="tdShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2B1E22" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#tdBg)"/>
  <g filter="url(#tdShadow)" transform="translate(200, 150)">
    <ellipse cx="0" cy="0" rx="110" ry="75" fill="#FFF9F6" stroke="url(#dishGold)" stroke-width="4.5"/>
    <ellipse cx="0" cy="0" rx="90" ry="58" fill="#FDF2F4" stroke="#E5D5CD" stroke-width="1.5"/>
    <circle cx="-35" cy="-10" r="14" fill="#E07A86" opacity="0.8"/>
    <circle cx="30" cy="15" r="16" fill="#9B4A58" opacity="0.85"/>
    <circle cx="-15" cy="18" r="3.5" fill="url(#dishGold)"/>
    <circle cx="45" cy="-15" r="4" fill="url(#dishGold)"/>
    <circle cx="-10" cy="10" r="12" fill="none" stroke="url(#dishGold)" stroke-width="2.5"/>
    <polygon points="-10,2 -6,-2 -14,-2" fill="url(#dishGold)"/>
    <ellipse cx="-20" cy="-25" rx="55" ry="20" fill="#FFFFFF" opacity="0.45"/>
  </g>
</svg>