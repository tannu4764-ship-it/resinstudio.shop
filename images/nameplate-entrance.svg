    <path d="M 20 80 Q 150 40 290 90" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.65"/>
    <path d="M 40 120 Q 160 85 280 130" stroke="#C89B84" stroke-width="2" fill="none" opacity="0.5"/>
    <circle cx="85" cy="70" r="4" fill="url(#gold3d)"/>
    <circle cx="170" cy="55" r="5" fill="url(#gold3d)"/>
    <rect x="10" y="10" width="290" height="150" rx="10" fill="none" stroke="url(#gold3d)" stroke-width="1" opacity="0.6"/>
    <text x="155" y="78" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="bold" fill="url(#gold3d)" text-anchor="middle" letter-spacing="2">THE SHARMAS</text>
    <text x="155" y="112" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Flat 402 • Anand Vihar</text>
    <text x="155" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E2D3CC" text-anchor="middle" letter-spacing="0.5">Govind Nagar, Kanpur</text>
    <circle cx="22" cy="22" r="4" fill="url(#gold3d)"/>
    <circle cx="288" cy="22" r="4" fill="url(#gold3d)"/>
    <circle cx="22" cy="148" r="4" fill="url(#gold3d)"/>
    <circle cx="288" cy="148" r="4" fill="url(#gold3d)"/>
